name: Build, backend and desktop validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Lantern.Tests/Lantern.Tests.csproj -c Release --logger trx
      - run: dotnet build Lantern.sln -c Release -warnaserror
      - run: dotnet test Lantern.UiTests/Lantern.UiTests.csproj -c Release --no-build --logger trx
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/TestResults/theme-*.png
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify IDE single-executable builds
        shell: pwsh
        run: |
          foreach ($flavor in @('SingleExe', 'SingleExeWithRuntime')) {
            dotnet build Lantern.sln -c $flavor -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $flavor" }
            $bundleDirectory = Join-Path $PWD "artifacts/single-exe/win-x64/$flavor"
            $bundleFiles = @(Get-ChildItem $bundleDirectory -File -Recurse)
            if ($bundleFiles.Count -ne 1 -or $bundleFiles[0].Name -ne 'Lantern.exe') {
              throw "Expected exactly one Lantern.exe in $bundleDirectory"
            }
          }
      - shell: pwsh
        run: |
          ./scripts/Publish.ps1 -RuntimeMode Bundled
          ./scripts/Publish.ps1 -RuntimeMode FrameworkDependent
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: artifacts/*.zip
